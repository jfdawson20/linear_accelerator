[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "linear-accelerator"
version = "2.0.0.dev0"
description = "Design tool for a multi-stage solenoid linear accelerator"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.6",
    "prettytable>=3.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
packages = ["la"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
